; BERT26 VCU, rebuilt to BERT27 conventions.
; Build: pio run      Flash: pio run -t upload
;
; Versions are pinned to the toolchain this code was verified with (Oct 2026).
; Teensy libraries (FlexCAN_T4, ST7735_t3/ST7796_t3, XPT2046_Touchscreen, SD,
; SPI, Wire) come bundled with framework-arduinoteensy 1.162.0.

[env:vcu]
platform = teensy@6.0.0
board = teensy41
framework = arduino
